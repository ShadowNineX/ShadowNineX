name: Refresh the workbench

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/update-workbench.mjs
      - scripts/update-workbench.test.mjs
      - .github/workflows/workbench.yml

permissions:
  contents: write

concurrency:
  group: profile-workbench
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Test the updater
        run: node --test scripts/update-workbench.test.mjs
      - name: Refresh public projects
        run: node scripts/update-workbench.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save only when the workbench changes
        run: |
          if git diff --quiet -- README.md; then
            echo "Workbench is already current."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'docs: refresh the public workbench'
          git push origin HEAD:main
